apiVersion: apps/v1
kind: Deployment
metadata:
  name: axion-ui
  namespace: axion
spec:
  replicas: 2

  selector:
    matchLabels:
      app: axion-ui

  template:
    metadata:
      labels:
        app: axion-ui

    spec:
      containers:
        - name: axion-ui
          image: axion-ui:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: axion-ui
  namespace: axion
spec:
  type: ClusterIP

  selector:
    app: axion-ui

  ports:
    - port: 80
      targetPort: 80