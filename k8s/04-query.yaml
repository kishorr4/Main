apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-query-service
  namespace: axion
spec:
  replicas: 2

  selector:
    matchLabels:
      app: telemetry-query-service

  template:
    metadata:
      labels:
        app: telemetry-query-service

    spec:
      containers:
        - name: telemetry-query-service
          image: axion-query:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              value: "postgresql://axion_user:P%40ssw01rd%40123@postgres:5432/axion_db"

---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-query-service
  namespace: axion
spec:
  type: ClusterIP

  selector:
    app: telemetry-query-service

  ports:
    - port: 8080
      targetPort: 8000